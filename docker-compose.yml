version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8088:8088"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - orchestrator-data:/app
    environment:
      - DATABASE_URL=sqlite:////app/orchestrator.db
      - HEALTH_CHECK_INTERVAL=5
      - MAX_RESTART_ATTEMPTS=5
      - RESTART_BACKOFF_BASE=5
      - API_HOST=0.0.0.0
      - API_PORT=8088
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  orchestrator-data: